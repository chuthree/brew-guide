[package]
name = "brew-guide"
version = "1.7.1"
description = "A coffee brewing assistant app"
authors = ["Brew Guide Team"]
license = "GPL-3.0-only"
repository = "https://github.com/chuthree/brew-guide"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.9.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "=2.8.0"
tauri-plugin-opener = "=2.5.3"
tauri-plugin-dialog = "=2.4.2"
chrono = "0.4"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
base64 = "=0.22.1"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
tokio-util = "0.7"
getrandom = "=0.3.4"
