name: Update SourceForge downloads

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sourceforge-defaults
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Follow the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCEFORGE_API_KEY: ${{ secrets.SOURCEFORGE_API_KEY }}
        run: python3 scripts/sourceforge-defaults.py
