name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
      - '!v*-online'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: false
        type: boolean

# Prevent concurrent builds to avoid conflicts with the same release
concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Unified naming pattern: BrewGuide_<version>_<platform>_<arch>.<ext>
  APP_NAME: 'BrewGuide'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS - Apple Silicon (M1+)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
            os_name: 'macos'
            arch: 'arm64'
            bundles: 'dmg'
          # macOS - Intel
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
            os_name: 'macos'
            arch: 'x64'
            bundles: 'dmg'
          # Windows x64
          - platform: windows-latest
            args: ''
            rust_target: ''
            os_name: 'windows'
            arch: 'x64'
            bundles: 'nsis'
          # Linux x64
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
            os_name: 'linux'
            arch: 'x64'
            bundles: 'appimage'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify offline native release configuration
        run: pnpm check:native-release

      # Read version from tauri.conf.json
      - name: Get app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Patch version for Windows MSI (strip pre-release tag)
      - name: Patch version for Windows
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          echo "Original version: $VERSION"

          # Strip everything after the first hyphen to make it MSI compliant (Major.Minor.Build)
          CLEAN_VERSION=$(echo $VERSION | sed -E 's/-.*//')
          echo "Patched version for Windows: $CLEAN_VERSION"

          # Update tauri.conf.json
          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const conf = require(path);
            conf.version = '$CLEAN_VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          "

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0.6
        with:
          tauriScript: pnpm tauri
          retryAttempts: 3
          args: ${{ matrix.args }} --bundles ${{ matrix.bundles }} -- --locked

      # Rename and upload artifacts with standardized names
      - name: Rename and upload macOS artifacts
        if: success() && matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          mkdir -p renamed-artifacts

          # Find and rename DMG
          DMG_FILE=$(find src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "renamed-artifacts/${{ env.APP_NAME }}_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}.dmg"
          fi

      - name: Rename and upload Windows artifacts
        if: success() && matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          mkdir -p renamed-artifacts

          # Find and rename NSIS exe
          EXE_FILE=$(find src-tauri/target/release/bundle/nsis -name "*.exe" 2>/dev/null | head -1)
          if [ -n "$EXE_FILE" ]; then
            cp "$EXE_FILE" "renamed-artifacts/${{ env.APP_NAME }}_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}.exe"
          fi

      - name: Rename and upload Linux artifacts
        if: success() && matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          mkdir -p renamed-artifacts

          # Find and rename AppImage
          APPIMAGE_FILE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -1)
          if [ -n "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" "renamed-artifacts/${{ env.APP_NAME }}_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}.AppImage"
          fi

      - name: Upload installers to draft release
        if: github.ref_type == 'tag' || github.event.inputs.create_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.app_version.outputs.version) }}
          VERSION: ${{ steps.app_version.outputs.version }}
          RELEASE_NOTES: |
            ### 安装说明

            - macOS：Apple 芯片选 arm64 DMG，Intel 芯片选 x64 DMG
            - Windows：EXE；Linux：AppImage
            - Android：APK 覆盖安装；iOS / iPadOS：IPA 自行签名安装
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            PRERELEASE=()
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
              --title "Brew Guide v$VERSION" --notes "$RELEASE_NOTES" "${PRERELEASE[@]}" \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" renamed-artifacts/* --clobber

      - name: Upload renamed artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_${{ steps.app_version.outputs.version }}_${{ matrix.os_name }}_${{ matrix.arch }}
          path: renamed-artifacts/*
          if-no-files-found: warn
          retention-days: 30
